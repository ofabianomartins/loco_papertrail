[package]
name = "loco-papertrail"
version = "0.1.0"
edition = "2024"
description = "It's a change data tracker to sea_orm"
authors = ["Fabiano Martins <fabiano.paula.martins@gmail.com>"]
license = "MIT"
repository = "https://github.com/ofabianomartins/loco_papertrail"

[dependencies]
syn = "2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sea-orm = { version = "1.1", features = [
  "debug-print",
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
paste = "1.0.15"
chrono = "0.4.42"
uuid = { version = "1.18.1", features = ["v4"] }
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread", "test-util", "full"] }

[dev-dependencies]
loco-factory = "0.1.0"

